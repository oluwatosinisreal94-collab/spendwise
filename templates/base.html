
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SpendWise helps you track expenses and manage your budgets.">
    <title>{% block title %}SpendWise{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="site-header">
        <nav class="navbar container">
            <a href="{{ url_for('index') }}" class="logo">SpendWise<span>.</span></a>

            <div class="nav-links">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="#features">Features</a>
                <a href="{{ url_for('login') }}" class="nav-login">Login</a>
                <a href="{{ url_for('register') }}" class="btn btn-small">Get Started</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 SpendWise. Take control of your money.</p>
        </div>
    </footer>

</body>
</html>
